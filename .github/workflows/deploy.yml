name: Deploy to VPS

# Run after CI completes on main. Skip if CI failed.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  # Manual override — useful for re-running after fixing the VPS
  # without pushing a new commit.
  workflow_dispatch:

# Never run two deploys in parallel, and never cancel a deploy mid-flight
# (a half-restarted API + half-built web is the worst possible state).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Push & rebuild on iffeds.org
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_run fires for both success and failure; only deploy on success.
    # workflow_dispatch has no workflow_run context, so allow it through.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout the exact commit CI tested
        uses: actions/checkout@v4
        with:
          # workflow_run fires from the default branch's workflow file but
          # the head_sha points at the commit that was tested. For
          # workflow_dispatch fall back to the dispatched ref.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Configure SSH key + pin host fingerprint
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          # Fingerprint is public information — pin it in code so every
          # deploy verifies the host key against this known value before
          # trusting the live key from ssh-keyscan. Update only if you
          # intentionally rebuild the VPS.
          EXPECTED_FP: SHA256:aARL3B4WSb4cDTNKgeEwRLoezzhxy3vjuLdDRXWyunA
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          HOST=$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')
          KEY=$(ssh-keyscan -t ed25519 "$HOST" 2>/dev/null)
          if [ -z "$KEY" ]; then
            echo "::error::ssh-keyscan returned no key for the VPS"; exit 1
          fi
          ACTUAL_FP=$(printf '%s\n' "$KEY" | ssh-keygen -lf - | awk '{print $2}')
          if [ "$ACTUAL_FP" != "$EXPECTED_FP" ]; then
            echo "::error::Host key fingerprint mismatch (expected $EXPECTED_FP, got $ACTUAL_FP) — possible MITM or VPS was rebuilt"
            exit 1
          fi
          printf '%s\n' "$KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "Host fingerprint verified: $ACTUAL_FP"

      - name: Sync source tree to /home/iffe/IFFE
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          DEPLOY_HOST_CLEAN=$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          rsync -az --delete \
            -e "ssh $SSH_OPTS" \
            --exclude node_modules \
            --exclude .next \
            --exclude dist \
            --exclude .vercel \
            --exclude .turbo \
            --exclude api-bundle \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.production' \
            --exclude '.git' \
            ./ "iffe@${DEPLOY_HOST_CLEAN}:/home/iffe/IFFE/"

      - name: Install, migrate, build, restart on the VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          DEPLOY_HOST_CLEAN=$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')
          ssh -i "$HOME/.ssh/deploy_key" \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "iffe@${DEPLOY_HOST_CLEAN}" \
              'bash /home/iffe/IFFE/scripts/deploy-vps.sh'

      - name: Smoke-test the live site through Cloudflare
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsS -m 10 https://iffeds.org/api/v1/health || true)
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "Live health OK: $body"
              exit 0
            fi
            echo "attempt $attempt: not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "Live health failed after 5 attempts" >&2
          exit 1
